<!DOCTYPE html>
<html>
<head>
    <title>Register | Coursify</title>
</head>
<body>

<h1>Register</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    {% if form.errors %}
        <div style="color:red;">
            {{ form.errors }}
        </div>
    {% endif %}

    <button type="submit">Register</button>
</form>

</body>
</html>
